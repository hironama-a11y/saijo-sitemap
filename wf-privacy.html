<style>
:root{--primary:#4361ee;--dark:#0f172a;--gray-700:#334155;--gray-500:#64748b;--gray-400:#94a3b8;--gray-300:#cbd5e1;--gray-200:#e2e8f0;--gray-100:#f1f5f9;--gray-50:#f8fafc;--white:#fff;--new:#2563eb;--mod:#c2410c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP','Inter',sans-serif;background:#edf0f7;color:#1e293b;display:flex;flex-direction:column;min-height:100vh;color-scheme:light}
.header{background:var(--dark);padding:20px 32px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.header-left{display:flex;flex-direction:column;gap:8px}
.header h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:.08em}
.header-company{display:flex;align-items:center;gap:8px}
.company-name{font-size:11px;color:var(--gray-400)}
.header-badge{background:rgba(255,255,255,.08);padding:4px 12px;border-radius:20px;font-size:11px;color:var(--gray-300);border:1px solid rgba(255,255,255,.12)}
.header-meta{font-size:11px;color:var(--gray-400)}
.header-back{display:inline-flex;align-items:center;gap:6px;color:#cbd5e1;text-decoration:none;font-size:12px;font-weight:500;padding:6px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);white-space:nowrap;margin-left:auto}
.header-back:hover,.header-back:focus-visible{color:#fff;background:rgba(255,255,255,.14)}
.header-back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.info-bar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:10px 32px;display:flex;gap:8px 24px;align-items:center;font-size:12px;color:var(--gray-500);flex-wrap:wrap}
.info-bar strong{color:var(--gray-700);font-weight:600}
.back-link{color:var(--primary);text-decoration:none;font-weight:500}
.back-link:hover{text-decoration:underline}
.status{font-size:11px;font-weight:700;color:#fff;padding:2px 10px;border-radius:4px;background:var(--gray-400)}
.status.new{background:var(--new)}.status.mod{background:var(--mod)}
main{flex:1 0 auto;padding:32px 32px 32px 60px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:32px}
.wf-container{background:var(--white);border-radius:12px;padding:24px;width:480px;max-width:100%;flex-shrink:0}
.wf-section{padding:10px 0;border-bottom:1px dashed var(--gray-200)}
.wf-section:last-child{border-bottom:none}
.wf-bar{border-radius:3px}.wf-bar.dark{background:#334155}.wf-bar.accent{background:var(--primary)}
.wf-heading{font-size:11px;font-weight:600;color:var(--gray-500);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.sec-flag{font-size:9px;font-weight:700;color:#fff;padding:1px 6px;border-radius:3px}
.sec-flag.new{background:var(--new)}.sec-flag.mod{background:var(--mod)}
.wf-line{height:4px;background:#d1d5db;border-radius:2px}
.w90{width:90%}.w85{width:85%}.w80{width:80%}.w70{width:70%}.w65{width:65%}.w60{width:60%}.w50{width:50%}
.mt4{margin-top:4px}.mt8{margin-top:8px}
.wf-block{border-radius:4px}
.wf-btn{height:14px;border-radius:3px}
.wf-input{height:20px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:4px}
.wf-card{flex:1;background:#f8fafc;border:1px solid #e5e7eb;border-radius:4px;padding:6px;min-width:0}
.wf-table{width:100%;border-collapse:collapse}
.wf-table td{border:1px solid #e5e7eb;height:18px;background:#f8fafc}
.wf-table td:first-child{width:30%;background:#f1f5f9}
.info-sections{background:var(--white);border-radius:12px;padding:24px;width:360px;max-width:100%;flex-shrink:0}
.info-title{font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--primary)}
.info-role-text{font-size:12px;color:#475569;line-height:1.8;margin-bottom:20px}
.info-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.info-row:last-child{border-bottom:none}
.info-num{width:20px;height:20px;background:var(--primary);color:#fff;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.info-name{font-size:12px;font-weight:600;color:var(--gray-700);display:flex;align-items:center;gap:6px}
.info-desc{font-size:11px;color:var(--gray-500);margin-top:2px;line-height:1.6}
.footer{background:var(--white);padding:16px 32px;border-top:2px solid var(--gray-200);display:flex;align-items:center;gap:24px;font-size:11px;color:var(--gray-400);flex-wrap:wrap}
.footer-logo{opacity:.5}
.footer-right{margin-left:auto}
</style>
</head>
